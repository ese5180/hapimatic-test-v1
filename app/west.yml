manifest:
  self:
    path: app

  remotes:
    - name: zephyrproject-rtos
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: zephyrproject-rtos
      revision: v4.5.0
      import:
        # Only pull the modules this board actually needs, instead of all ~80.
        # Add names here (e.g. mbedtls, littlefs) as the project grows.
        name-allowlist:
          - cmsis_6
          - hal_stm32
          - loramac-node
