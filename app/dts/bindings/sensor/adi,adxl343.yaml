description: |
  Analog Devices ADXL343 3-axis digital accelerometer on I2C.

  The driver uses full-resolution mode, so the scale is 3.9 mg/LSB at every
  range. I2C address is 0x53 with SDO/ALT ADDRESS low, 0x1D with it high.

  Example:

    &i2c2 {
        adxl343@53 {
            compatible = "adi,adxl343";
            reg = <0x53>;
            range = <2>;
            odr = <100>;
        };
    };

compatible: "adi,adxl343"

include: [sensor-device.yaml, i2c-device.yaml]

properties:
  range:
    type: int
    default: 2
    enum: [2, 4, 8, 16]
    description: Measurement range in g (+/-).

  odr:
    type: int
    default: 100
    enum: [25, 50, 100, 200, 400, 800, 1600, 3200]
    description: Output data rate in Hz.
